# Render Blueprint - Contract OS backend (NestJS)
# Free tier: web service (spins down after 15 min idle, ~30s cold start on wake).
# The free plan has no persistent disk, so STORAGE_DRIVER=r2 persists uploads in Cloudflare R2.
#
# Required envVars you MUST provide (sync: false) before first deploy:
#   DATABASE_URL          -> your Neon PostgreSQL connection string
#   R2_ACCOUNT_ID         -> Cloudflare account ID (from R2 dashboard)
#   R2_ACCESS_KEY_ID      -> R2 API token access key
#   R2_SECRET_ACCESS_KEY  -> R2 API token secret
#   R2_BUCKET             -> your R2 bucket name
#   CORS_ORIGIN           -> your Vercel frontend URL (update the placeholder below)

services:
  - type: web
    name: contract-os-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run migrate:deploy && npm run start:backend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_DRIVER
        value: r2
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false