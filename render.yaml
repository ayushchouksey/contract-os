# Render Blueprint - Contract OS backend (NestJS)
# Free tier: web service (spins down after 15 min idle, ~30s cold start on wake).
# No credit card required for Vercel + Render + Neon (all card-free).
#
# Storage on Render's free plan is ephemeral (wiped on redeploy/restart).
#   - STORAGE_DRIVER=local (default): uploads work while the service is up but are lost on redeploy. Fine for a demo.
#   - STORAGE_DRIVER=r2: persistent uploads via Cloudflare R2 (card-free, email-only signup). Optional.
#
# Required envVar you MUST provide (sync: false) before first deploy:
#   DATABASE_URL          -> your Neon PostgreSQL connection string
#   CORS_ORIGIN           -> your Vercel frontend URL (update the placeholder below)
# Optional (only if STORAGE_DRIVER=r2): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

services:
  - type: web
    name: contract-os-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run migrate:deploy && npm run start:backend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_DRIVER
        value: local
      - key: CORS_ORIGIN
        value: https://contract-os-frontend-1.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false