# Contract OS - nginx site
# Frontend (Next.js) on :3000, backend (NestJS) on :3001, API exposed at /api
server {
    listen 80;
    listen [::]:80;
    server_name _;                       # replaced with your domain by setup.sh

    client_max_body_size 50m;            # match backend multer limit

    # API -> NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3001;          # no trailing slash: keeps /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";      # websocket support
    }
}