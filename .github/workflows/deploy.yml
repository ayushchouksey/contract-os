name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend
        run: npm run build -w apps/frontend

  deploy-render:
    name: Deploy backend to Render
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -fsS -X POST --max-time 60 "$RENDER_HOOK"
            echo "Render deploy triggered."
          else
            echo "Render deploy skipped: RENDER_DEPLOY_HOOK_URL secret is not set."
          fi

  deploy-vercel:
    name: Deploy frontend to Vercel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            curl -fsS -X POST --max-time 60 "$VERCEL_HOOK"
            echo "Vercel deploy triggered."
          else
            echo "Vercel deploy skipped: VERCEL_DEPLOY_HOOK_URL secret is not set."
          fi