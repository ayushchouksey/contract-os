name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build:backend
      - name: Build frontend
        run: npm run build -w apps/frontend

  deploy-render:
    name: Deploy backend to Render
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST --max-time 60 "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered."
      - name: Skip (hook URL not configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Render deploy skipped: RENDER_DEPLOY_HOOK_URL secret is not set."

  deploy-vercel:
    name: Deploy frontend to Vercel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST --max-time 60 "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel deploy triggered."
      - name: Skip (hook URL not configured)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: echo "Vercel deploy skipped: VERCEL_DEPLOY_HOOK_URL secret is not set."